server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /ready {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}