server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudnotes
    static_configs:
      - targets:
          - localhost
        labels:
          app: cloudnotes
          job: cloudnotes
          __path__: /var/log/cloudnotes/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            message: message
            timestamp: timestamp
      - labels:
          level:
