apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudnotes
  template:
    metadata:
      labels:
        app: cloudnotes
    spec:
      containers:
        - name: cloudnotes
          image: cloudnotes:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
